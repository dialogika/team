<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads WhatsApp Agent — DIALOGIKA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1F3864; --blue:#2E75B6; --yellow:#FFC000; --light:#F2F6FC;
    --border:#D9D9D9; --text:#1a1a2e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Poppins',Arial,sans-serif; background:var(--light); color:var(--text); font-size:13px; }
  header { background:var(--navy); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:600; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--yellow); display:inline-block; }
  #rekap { display:flex; gap:8px; padding:12px 22px 0; flex-wrap:wrap; }
  .chip { background:#fff; border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:12px; }
  .chip b { font-size:14px; }
  #toolbar { display:flex; gap:8px; padding:12px 22px; flex-wrap:wrap; align-items:center; }
  input,select,textarea,button { font-family:inherit; font-size:13px; }
  #q { flex:1; min-width:190px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; }
  select { padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; }
  .btn { border:none; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:500; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-yellow { background:var(--yellow); color:var(--navy); font-weight:600; }
  .btn-ghost { background:#fff; border:1px solid var(--border); }
  #tablewrap { margin:0 22px 26px; overflow:auto; background:#fff; border:1px solid var(--border); border-radius:10px; max-height:calc(100vh - 210px); }
  table { border-collapse:collapse; width:max-content; min-width:100%; }
  th { position:sticky; top:0; background:var(--navy); color:#fff; padding:9px 10px; font-size:11.5px; font-weight:600; text-align:left; white-space:nowrap; z-index:2; }
  td { border-bottom:1px solid #eef1f6; padding:7px 10px; vertical-align:top; white-space:nowrap; }
  tr:hover td { background:#F6FAFF; }
  td.notes { white-space:normal; min-width:260px; max-width:420px; font-size:12px; }
  td.num { text-align:right; }
  .badge { padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; display:inline-block; }
  .s-hot { background:#FCE4D6; color:#C55A11; } .s-fu { background:#FFF2CC; color:#946c00; }
  .s-inv { background:#DDEBF7; color:#2E75B6; } .s-nur { background:#EDEDED; color:#666; }
  .s-rej { background:#F8CBAD; color:#C00000; } .s-clo { background:#E2EFDA; color:#548235; }
  .icon-btn { border:none; background:none; cursor:pointer; font-size:15px; padding:2px 5px; }
  /* modal */
  #overlay { position:fixed; inset:0; background:rgba(15,25,50,.45); display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:30px 12px; z-index:10; }
  #overlay.open { display:flex; }
  #modal { background:#fff; border-radius:12px; width:720px; max-width:100%; padding:22px; }
  #modal h2 { font-size:15px; color:var(--navy); margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .field.full { grid-column:1/-1; }
  .field label { font-size:11px; font-weight:600; color:#555; }
  .field input,.field select,.field textarea { padding:7px 10px; border:1px solid var(--border); border-radius:7px; }
  .field textarea { min-height:80px; resize:vertical; }
  #modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  #status-msg { padding:0 22px; color:#C00000; font-size:12px; min-height:16px; }
  #loading { padding:30px; text-align:center; color:#888; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>DIALOGIKA — Leads WhatsApp Agent</h1>
  <span style="font-size:11.5px;opacity:.75" id="lastload"></span>
</header>

<div id="rekap"></div>
<div id="toolbar">
  <input id="q" placeholder="Cari nama / nomor WA / notes / program / kota...">
  <select id="fstatus">
    <option value="">Semua Status</option>
    <option>Hot Leads</option><option>Follow Up</option><option>Invoice</option>
    <option>Nurture</option><option>Reject</option><option>Closing</option>
  </select>
  <button class="btn btn-ghost" onclick="loadLeads()">&#8635; Refresh</button>
  <button class="btn btn-yellow" onclick="openModal()">+ Tambah Lead</button>
</div>
<div id="status-msg"></div>

<div id="tablewrap">
  <div id="loading">Memuat data...</div>
  <table id="tbl" style="display:none">
    <thead><tr>
      <th>No</th><th>Nama</th><th>Nomor WhatsApp</th><th>Status</th><th>Follow Up</th>
      <th>Program</th><th>Offering</th><th>Alamat</th><th>Notes</th><th>Date In</th>
      <th>Date Close</th><th>Channel</th><th>Work</th><th>Last Response</th>
      <th>Last Update</th><th>Next Follow Up</th><th>Nominal Deal (Rp)</th><th>Aksi</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="overlay">
  <div id="modal">
    <h2 id="modal-title">Tambah Lead</h2>
    <div class="grid">
      <div class="field"><label>Nama</label><input id="f_nama"></div>
      <div class="field"><label>Nomor WhatsApp (628xxx)</label><input id="f_whatsapp"></div>
      <div class="field"><label>Status</label>
        <select id="f_status">
          <option>Hot Leads</option><option>Follow Up</option><option>Invoice</option>
          <option>Nurture</option><option>Reject</option><option>Closing</option>
        </select>
      </div>
      <div class="field"><label>Follow Up (berapa kali)</label><input id="f_follow_up" type="number" min="0" value="0"></div>
      <div class="field"><label>Program (yang diminati)</label><input id="f_program"></div>
      <div class="field"><label>Offering (yang ditawarkan)</label><input id="f_offering"></div>
      <div class="field"><label>Alamat / Kota</label><input id="f_alamat"></div>
      <div class="field"><label>Channel (tahu dari mana)</label><input id="f_channel"></div>
      <div class="field"><label>Work / Pekerjaan</label><input id="f_work"></div>
      <div class="field"><label>Nominal Deal (Rp)</label><input id="f_nominal_deal" type="number" min="0"></div>
      <div class="field"><label>Date In</label><input id="f_date_in" type="datetime-local"></div>
      <div class="field"><label>Date Close</label><input id="f_date_close" type="datetime-local"></div>
      <div class="field"><label>Last Response</label><input id="f_last_response" type="datetime-local"></div>
      <div class="field"><label>Next Follow Up</label><input id="f_next_follow_up" type="date"></div>
      <div class="field full"><label>Notes (rangkuman kebutuhan & perkembangan follow up)</label><textarea id="f_notes"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="savebtn" onclick="saveLead()">Simpan</button>
    </div>
  </div>
</div>

<script>
/* ================= KONFIGURASI =================
   Firestore project pre-dialogika, koleksi wa_leads.
   Field: nomor(int), nama, whatsapp, status, follow_up(int), program, offering,
   alamat, notes, date_in, date_close, channel, work, last_response,
   last_update, next_follow_up, nominal_deal(int).
   Tanggal disimpan sebagai string ISO "YYYY-MM-DDTHH:mm".
   WhatsApp Agent (Hermes) menulis dokumen dengan struktur field yang sama via REST:
   POST https://firestore.googleapis.com/v1/projects/pre-dialogika/databases/(default)/documents/wa_leads?key=API_KEY
================================================ */
const KEY = 'AIzaSyBaO-zl70HgAPq9rtRgoGceS-qvkjnDuG0';
const BASE = 'https://firestore.googleapis.com/v1/projects/pre-dialogika/databases/(default)/documents';
const COL = 'wa_leads';
const STR_FIELDS = ['nama','whatsapp','status','program','offering','alamat','notes','date_in','date_close','channel','work','last_response','last_update','next_follow_up'];
const INT_FIELDS = ['nomor','follow_up','nominal_deal'];
const BADGE = {'Hot Leads':'s-hot','Follow Up':'s-fu','Invoice':'s-inv','Nurture':'s-nur','Reject':'s-rej','Closing':'s-clo'};

let leads = [];
let editingId = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function decode(doc) {
  const o = { id: doc.name.split('/').pop() };
  for (const [k, v] of Object.entries(doc.fields || {})) {
    o[k] = v.integerValue !== undefined ? parseInt(v.integerValue)
         : v.doubleValue  !== undefined ? v.doubleValue
         : v.timestampValue !== undefined ? v.timestampValue
         : v.stringValue ?? '';
  }
  return o;
}
function encode(o) {
  const fields = {};
  for (const k of STR_FIELDS) if (o[k] !== undefined && o[k] !== '') fields[k] = { stringValue: String(o[k]) };
  for (const k of INT_FIELDS) if (o[k] !== undefined && o[k] !== '' && o[k] !== null && !isNaN(o[k])) fields[k] = { integerValue: String(parseInt(o[k])) };
  return { fields };
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return esc(s);
  const p = n => String(n).padStart(2,'0');
  const hasTime = String(s).length > 10;
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}` + (hasTime ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : '');
}
const fmtRp = n => (n === undefined || n === '' || isNaN(n)) ? '' : 'Rp ' + Number(n).toLocaleString('id-ID');

async function api(path, opt = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(`${path}${sep}key=${KEY}`, { headers: {'Content-Type':'application/json'}, ...opt });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || `HTTP ${r.status}`);
  return j;
}

async function loadLeads() {
  $('status-msg').textContent = '';
  $('loading').style.display = 'block'; $('tbl').style.display = 'none';
  try {
    let docs = [], token = '';
    do {
      const j = await api(`${BASE}/${COL}?pageSize=300${token ? '&pageToken=' + token : ''}`);
      docs = docs.concat(j.documents || []);
      token = j.nextPageToken || '';
    } while (token);
    leads = docs.map(decode).sort((a, b) => (a.nomor ?? 1e9) - (b.nomor ?? 1e9) || String(a.date_in||'').localeCompare(String(b.date_in||'')));
    render();
    $('lastload').textContent = 'dimuat ' + new Date().toLocaleTimeString('id-ID');
  } catch (e) {
    $('status-msg').textContent = 'Gagal memuat: ' + e.message;
  }
  $('loading').style.display = 'none'; $('tbl').style.display = '';
}

function render() {
  const q = $('q').value.toLowerCase().trim();
  const fs = $('fstatus').value;
  const rows = leads.filter(l =>
    (!fs || l.status === fs) &&
    (!q || ['nama','whatsapp','notes','program','offering','alamat','channel','work'].some(k => String(l[k]||'').toLowerCase().includes(q)))
  );
  $('tbody').innerHTML = rows.map(l => `<tr>
    <td class="num">${esc(l.nomor ?? '')}</td>
    <td><b>${esc(l.nama)}</b></td>
    <td>${esc(l.whatsapp)}</td>
    <td><span class="badge ${BADGE[l.status]||''}">${esc(l.status)}</span></td>
    <td class="num">${esc(l.follow_up ?? '')}</td>
    <td>${esc(l.program)}</td>
    <td>${esc(l.offering)}</td>
    <td>${esc(l.alamat)}</td>
    <td class="notes">${esc(l.notes)}</td>
    <td>${fmtDate(l.date_in)}</td>
    <td>${fmtDate(l.date_close)}</td>
    <td>${esc(l.channel)}</td>
    <td>${esc(l.work)}</td>
    <td>${fmtDate(l.last_response)}</td>
    <td>${fmtDate(l.last_update)}</td>
    <td>${fmtDate(l.next_follow_up)}</td>
    <td class="num">${fmtRp(l.nominal_deal)}</td>
    <td>
      <button class="icon-btn" title="Edit" onclick="openModal('${l.id}')">&#9998;</button>
      <button class="icon-btn" title="Hapus" onclick="delLead('${l.id}')">&#128465;</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="18" style="text-align:center;color:#999;padding:24px">Tidak ada data</td></tr>';
  renderRekap();
}

function renderRekap() {
  const c = s => leads.filter(l => l.status === s).length;
  const total = leads.length;
  const closing = c('Closing');
  const nominal = leads.filter(l => l.status === 'Closing').reduce((a, l) => a + (Number(l.nominal_deal) || 0), 0);
  $('rekap').innerHTML = `
    <span class="chip">Total <b>${total}</b></span>
    <span class="chip">Hot Leads <b>${c('Hot Leads')}</b></span>
    <span class="chip">Follow Up <b>${c('Follow Up')}</b></span>
    <span class="chip">Invoice <b>${c('Invoice')}</b></span>
    <span class="chip">Nurture <b>${c('Nurture')}</b></span>
    <span class="chip">Reject <b>${c('Reject')}</b></span>
    <span class="chip">Closing <b>${closing}</b></span>
    <span class="chip">Closing Rate <b>${total ? (closing/total*100).toFixed(1) : 0}%</b></span>
    <span class="chip">Nominal Closing <b>${fmtRp(nominal) || 'Rp 0'}</b></span>`;
}

function openModal(id) {
  editingId = id || null;
  $('modal-title').textContent = id ? 'Edit Lead' : 'Tambah Lead';
  const l = id ? leads.find(x => x.id === id) : {};
  for (const k of ['nama','whatsapp','program','offering','alamat','notes','channel','work','date_in','date_close','last_response','next_follow_up']) $('f_'+k).value = l[k] || '';
  $('f_status').value = l.status || 'Hot Leads';
  $('f_follow_up').value = l.follow_up ?? 0;
  $('f_nominal_deal').value = l.nominal_deal ?? '';
  if (!id) {
    const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    $('f_date_in').value = now.toISOString().slice(0,16);
  }
  $('overlay').classList.add('open');
}
function closeModal() { $('overlay').classList.remove('open'); }

async function saveLead() {
  $('savebtn').disabled = true;
  try {
    const o = {};
    for (const k of ['nama','whatsapp','program','offering','alamat','notes','channel','work','date_in','date_close','last_response','next_follow_up']) o[k] = $('f_'+k).value.trim();
    o.status = $('f_status').value;
    o.follow_up = $('f_follow_up').value;
    o.nominal_deal = $('f_nominal_deal').value;
    const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    o.last_update = now.toISOString().slice(0,16);
    if (!o.whatsapp && !o.nama) throw new Error('Minimal isi Nama atau Nomor WhatsApp');
    if (editingId) {
      o.nomor = leads.find(x => x.id === editingId)?.nomor;
      const body = encode(o);
      const mask = Object.keys(body.fields).map(f => 'updateMask.fieldPaths=' + f).join('&');
      await api(`${BASE}/${COL}/${editingId}?${mask}`, { method:'PATCH', body: JSON.stringify(body) });
    } else {
      o.nomor = leads.reduce((m, l) => Math.max(m, Number(l.nomor) || 0), 0) + 1;
      await api(`${BASE}/${COL}`, { method:'POST', body: JSON.stringify(encode(o)) });
    }
    closeModal();
    await loadLeads();
  } catch (e) {
    alert('Gagal menyimpan: ' + e.message);
  }
  $('savebtn').disabled = false;
}

async function delLead(id) {
  const l = leads.find(x => x.id === id);
  if (!confirm(`Hapus lead "${l?.nama || l?.whatsapp || id}"?`)) return;
  try { await api(`${BASE}/${COL}/${id}`, { method:'DELETE' }); await loadLeads(); }
  catch (e) { alert('Gagal menghapus: ' + e.message); }
}

$('q').addEventListener('input', render);
$('fstatus').addEventListener('change', render);
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
loadLeads();
</script>
</body>
</html>
