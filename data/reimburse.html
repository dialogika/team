<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reimburse Monitoring</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	<link href="../assets/css/style.css" rel="stylesheet" />
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/lucide@latest"></script>
	<style>
		body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fbff; }
		.glass-header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
		.card-elite { background: #ffffff; border: 1px solid #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02), 0 8px 10px -6px rgba(0, 0, 0, 0.02); }
		.modal-backdrop { background: rgba(255,255,255,0.18); backdrop-filter: blur(8px) saturate(120%); }
		.modal-panel { transform: translateY(6px) scale(.99); opacity: 0; transition: transform .22s ease, opacity .22s ease; }
		.modal-open .modal-panel { transform: translateY(0) scale(1); opacity: 1; }
		.avatar-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(15,23,42,0.12); }
		.toast-wrap { position: fixed; top: 1rem; right: 1rem; z-index: 60; }
		.toast { background: rgba(255,255,255,0.92); color: #0f172a; padding: 10px 14px; border-radius: 12px; box-shadow: 0 10px 20px rgba(15,23,42,0.08); margin-top: 8px; font-size: 13px; border: 1px solid rgba(148,163,184,0.25); }
		.toast-item { transform: translateY(-6px) scale(.98); opacity: 0; transition: transform .24s ease, opacity .24s ease; }
		.toast-item.toast-enter { transform: translateY(0) scale(1); opacity: 1; }
		.toast-item.toast-leave { transform: translateY(-8px) scale(.98); opacity: 0; }
	</style>
</head>
<body class="text-slate-800 pb-20">

	<div id="topbarContainer"></div>

	<div class="dashboard-container">
		<div id="sidebarContainer"></div>

		<main class="main-content">
			<nav class="sticky top-0 z-50 glass-header border-b border-slate-100 px-6 md:px-8 py-5 mb-8">
				<div class="max-w-7xl mx-auto flex justify-between items-center">
					<div>
						<h1 class="text-2xl font-bold tracking-tight text-slate-900">Monitoring Reimburse</h1>
						<p class="text-xs text-slate-500 font-medium">Pantau status reimburse izin karyawan</p>
					</div>
				</div>
			</nav>

			<main class="max-w-7xl mx-auto px-4 md:px-8 space-y-8">
				<section class="card-elite rounded-[2rem] overflow-hidden">
					<div class="p-6 md:p-8 border-b border-slate-50 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
						<div class="flex items-center gap-3">
							<h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
								<i data-lucide="wallet" class="w-5 h-5 text-indigo-600"></i>
								Daftar Reimburse
							</h2>
							<span id="reimburseSummary" class="px-4 py-1.5 bg-slate-100 text-slate-600 text-xs font-bold rounded-full">Total: 0</span>
						</div>
						<div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
							<div class="relative">
								<i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
								<input
									id="reimburseSearch"
									type="text"
									placeholder="Cari nama karyawan..."
									class="pl-10 pr-4 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 w-full sm:w-64"
								>
							</div>
							<select
								id="reimburseStatusFilter"
								class="text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 font-medium text-slate-600 cursor-pointer w-full sm:w-auto"
							>
								<option value="">Semua Status</option>
								<option value="pending">Pending</option>
								<option value="completed">Completed</option>
							</select>
						</div>
					</div>

					<div class="overflow-x-auto">
						<table class="w-full text-left">
							<thead>
								<tr class="bg-slate-50/50">
									<th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Foto</th>
									<th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Nama</th>
									<th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Total Hari</th>
									<th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Total Jam</th>
									<th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Status</th>
									<th class="px-6 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest text-right">Aksi</th>
								</tr>
							</thead>
							<tbody id="reimburseTableBody" class="divide-y divide-slate-50"></tbody>
						</table>
					</div>
					<div class="bg-slate-50/50 p-4 text-center">
						<p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">End of data</p>
					</div>
				</section>
			</main>
		</main>
	</div>

	<div id="reimburseDetailModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
		<div class="bg-white/90 rounded-2xl p-6 w-full max-w-3xl mx-4 shadow-2xl border border-white/70 transform transition-transform duration-200 modal-panel" role="dialog" aria-modal="true">
			<div class="flex justify-between items-start">
				<div>
					<h3 id="detailModalTitle" class="text-lg font-bold">Detail Reimburse</h3>
					<p id="detailModalSubtitle" class="text-xs text-slate-500 mt-1">Ringkasan akumulasi</p>
				</div>
				<button id="detailModalClose" class="text-slate-400 hover:text-slate-700">&times;</button>
			</div>
			<div class="mt-4 grid grid-cols-2 gap-3 sm:gap-4">
				<div class="bg-white/80 rounded-2xl border border-slate-100 px-4 py-3">
					<p class="text-[11px] uppercase tracking-widest text-slate-400 font-semibold">Total Hari</p>
					<p id="detailTotalDays" class="text-xl font-bold text-slate-800">0</p>
				</div>
				<div class="bg-white/80 rounded-2xl border border-slate-100 px-4 py-3">
					<p class="text-[11px] uppercase tracking-widest text-slate-400 font-semibold">Total Jam</p>
					<p id="detailTotalHours" class="text-xl font-bold text-slate-800">0</p>
				</div>
			</div>
			<div class="mt-5 max-h-[55vh] overflow-y-auto pr-1" id="detailTimeline"></div>
			<div class="mt-5 flex justify-end">
				<button id="detailModalOk" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold">Tutup</button>
			</div>
		</div>
	</div>

	<div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module">
		lucide.createIcons();
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
		import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
		import {
			getFirestore,
			collection,
			query,
			orderBy,
			onSnapshot,
			updateDoc,
			doc,
			getDoc
		} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
		import { renderTopBar } from "../element/topbar.js";
		import { renderSidebar } from "../element/sidebar.js";

		const firebaseConfig = {
			apiKey: "AIzaSyDyzzEYbJkkl-N8snrQf14qvj8De4YliV0",
			authDomain: "pre-dialogika.firebaseapp.com",
			projectId: "pre-dialogika",
			storageBucket: "pre-dialogika.firebasestorage.app",
			messagingSenderId: "343771410480",
			appId: "1:343771410480:web:32881c9868522090237df5",
			measurementId: "G-SXN811P3N0"
		};

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const db = getFirestore(app);

		const topbarTarget = document.getElementById("topbarContainer");
		if (topbarTarget) renderTopBar(topbarTarget);
		const sidebarTarget = document.getElementById("sidebarContainer");
		if (sidebarTarget) renderSidebar(sidebarTarget);

		const reimburseTableBody = document.getElementById("reimburseTableBody");
		const reimburseSummary = document.getElementById("reimburseSummary");
		const reimburseSearch = document.getElementById("reimburseSearch");
		const reimburseStatusFilter = document.getElementById("reimburseStatusFilter");

		let allReimburse = [];
		let groupedReimburse = [];
		let currentSearch = "";
		let currentStatus = "";
		const userPhotoCache = {};

		function renderStatusBadge(statusRaw) {
			const value = String(statusRaw || "pending").toLowerCase();
			if (value === "completed") {
				return '<span class="px-3 py-1 bg-emerald-50 text-emerald-600 text-[10px] font-extrabold rounded-full uppercase tracking-tighter border border-emerald-100">Completed</span>';
			}
			return '<span class="px-3 py-1 bg-amber-50 text-amber-600 text-[10px] font-extrabold rounded-full uppercase tracking-tighter border border-amber-100">Pending</span>';
		}

		function formatDateRange(start, end) {
			if (!start && !end) return "-";
			const a = start || "";
			const b = end || start || "";
			return a && b && a !== b ? `${a} - ${b}` : (a || b || "-");
		}

		function formatNumber(value) {
			if (value === null || value === undefined || value === "") return "0";
			const num = Number(value);
			if (Number.isNaN(num)) return "0";
			return num % 1 === 0 ? String(num) : num.toFixed(1);
		}

		function getAvatarUrl(name) {
			const safe = encodeURIComponent(name || "User");
			return `https://ui-avatars.com/api/?name=${safe}&background=4F46E5&color=fff`;
		}

		async function resolveUserPhoto(userId) {
			if (!userId) return "";
			if (userPhotoCache[userId] !== undefined) return userPhotoCache[userId] || "";
			try {
				const userSnap = await getDoc(doc(db, 'users', userId));
				if (userSnap.exists()) {
					const u = userSnap.data() || {};
					const photo = u.photo || u.photo_url || u.photoURL || (u.profile && u.profile.photo) || "";
					userPhotoCache[userId] = photo || "";
					return userPhotoCache[userId];
				}
			} catch (e) {
				console.error('Gagal memuat foto user', e);
			}
			userPhotoCache[userId] = "";
			return "";
		}

		function buildGroupedReimburse(records) {
			const map = new Map();
			records.forEach(item => {
				const key = item.user_id || item.user_name || item.id;
				if (!map.has(key)) {
					map.set(key, {
						key,
						user_id: item.user_id || "",
						user_name: item.user_name || "-",
						user_photo: item.user_photo || "",
						items: [],
						total_days: 0,
						total_hours: 0,
						status: "completed"
					});
				}
				const group = map.get(key);
				const days = Number(item.total_days ?? item.days ?? 0) || 0;
				const hours = Number(item.total_hours ?? item.hours ?? 0) || 0;
				group.total_days += days;
				group.total_hours += hours;
				group.items.push(item);
				if (String(item.status || "pending").toLowerCase() !== "completed") {
					group.status = "pending";
				}
			});
			return Array.from(map.values());
		}

		function renderTable(records) {
			if (!reimburseTableBody) return;
			if (!records.length) {
				reimburseTableBody.innerHTML = '<tr><td colspan="6" class="px-6 py-6 text-center text-xs text-slate-400">Belum ada data reimburse.</td></tr>';
				if (reimburseSummary) reimburseSummary.textContent = "Total: 0";
				return;
			}
			const rows = records.map(item => {
				const statusBadge = renderStatusBadge(item.status);
				const avatar = item.user_photo || getAvatarUrl(item.user_name);
				const actionBtn = (String(item.status || "pending").toLowerCase() === "pending")
					? '<button data-action="complete" data-id="' + item.key + '" class="px-3 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">Set Completed</button>'
					: '<span class="text-[11px] text-slate-400">-</span>';
				const detailBtn = '<button data-action="detail" data-id="' + item.key + '" class="px-3 py-2 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl">Detail</button>';
				return (
					'<tr class="hover:bg-slate-50/50 transition" data-id="' + item.key + '">' +
						'<td class="px-6 py-5">' +
							'<img src="' + avatar + '" class="avatar-img" onerror="this.onerror=null;this.src=\'' + getAvatarUrl(item.user_name) + '\';" alt="Avatar">' +
						'</td>' +
						'<td class="px-6 py-5 text-sm font-semibold text-slate-800">' + (item.user_name || '-') + '</td>' +
						'<td class="px-6 py-5 text-sm text-slate-700">' + formatNumber(item.total_days) + '</td>' +
						'<td class="px-6 py-5 text-sm text-slate-700">' + formatNumber(item.total_hours) + '</td>' +
						'<td class="px-6 py-5">' + statusBadge + '</td>' +
						'<td class="px-6 py-5 text-right">' +
							'<div class="flex items-center justify-end gap-2">' +
								actionBtn +
								detailBtn +
							'</div>' +
						'</td>' +
					'</tr>'
				);
			}).join('');
			reimburseTableBody.innerHTML = rows;
			if (reimburseSummary) reimburseSummary.textContent = "Total: " + records.length;
			if (window.lucide && typeof window.lucide.createIcons === "function") {
				window.lucide.createIcons();
			}
		}

		function applyFilters() {
			let filtered = groupedReimburse.slice();
			const term = String(currentSearch || "").toLowerCase().trim();
			const statusVal = String(currentStatus || "").toLowerCase().trim();
			if (term) {
				filtered = filtered.filter(item => (item.user_name || '').toLowerCase().includes(term));
			}
			if (statusVal) {
				filtered = filtered.filter(item => String(item.status || '').toLowerCase() === statusVal);
			}
			renderTable(filtered);
		}

		function showToast(msg, type='info', ttl = 4000) {
			const wrap = document.getElementById('toastWrap');
			if (!wrap) return;
			const el = document.createElement('div');
			const base = 'toast-item rounded-xl px-4 py-2 mt-2 text-sm shadow-lg border';
			const theme = type === 'error'
				? 'bg-rose-600 text-white border-rose-500/40'
				: 'bg-white text-slate-900 border-slate-200';
			el.className = `${base} ${theme}`;
			el.textContent = msg;
			wrap.appendChild(el);
			setTimeout(()=> { el.classList.add('toast-enter'); }, 10);
			setTimeout(()=> { el.classList.remove('toast-enter'); el.classList.add('toast-leave'); setTimeout(()=>el.remove(),300); }, ttl);
		}

		async function markCompleted(key) {
			if (!key) return;
			const group = groupedReimburse.find(item => item.key === key);
			if (!group) return;
			try {
				const targets = group.items.filter(it => String(it.status || 'pending').toLowerCase() !== 'completed');
				await Promise.all(targets.map(it => updateDoc(doc(db, 'reimburse', it.id), { status: 'completed' })));
				showToast('Status reimburse diperbarui.', 'success');
			} catch (e) {
				console.error('Gagal mengubah status reimburse', e);
				showToast('Gagal mengubah status reimburse.', 'error');
			}
		}

		function openDetailModal(key) {
			const group = groupedReimburse.find(item => item.key === key);
			if (!group) return;
			const modal = document.getElementById('reimburseDetailModal');
			const title = document.getElementById('detailModalTitle');
			const subtitle = document.getElementById('detailModalSubtitle');
			const totalDays = document.getElementById('detailTotalDays');
			const totalHours = document.getElementById('detailTotalHours');
			const timeline = document.getElementById('detailTimeline');
			if (!modal || !timeline) return;
			if (title) title.textContent = `Detail Reimburse - ${group.user_name}`;
			if (subtitle) subtitle.textContent = `Total akumulasi dari ${group.items.length} pengajuan`;
			if (totalDays) totalDays.textContent = formatNumber(group.total_days);
			if (totalHours) totalHours.textContent = formatNumber(group.total_hours);
			const itemsHtml = group.items
				.slice()
				.sort((a, b) => String(b.start_date || '').localeCompare(String(a.start_date || '')))
				.map(item => {
					const dateLabel = formatDateRange(item.start_date, item.end_date);
					const jenis = (item.related && item.related.type) ? item.related.type : (item.type || '-');
					const reason = (item.related && item.related.reason) ? item.related.reason : (item.reason || '-');
					const days = formatNumber(item.total_days ?? item.days ?? 0);
					const hours = formatNumber(item.total_hours ?? item.hours ?? 0);
					return (
						'<div class="flex gap-4 py-4 border-b border-slate-100 last:border-b-0">' +
							'<div class="mt-1">' +
								'<div class="w-3 h-3 rounded-full bg-indigo-500"></div>' +
								'<div class="w-px h-full bg-indigo-100 mx-auto"></div>' +
							'</div>' +
							'<div class="flex-1">' +
								'<div class="flex flex-wrap items-center gap-2">' +
									'<span class="text-sm font-semibold text-slate-800">' + dateLabel + '</span>' +
									'<span class="px-2 py-0.5 text-[10px] bg-slate-100 text-slate-600 rounded-full">' + jenis + '</span>' +
								'</div>' +
								'<p class="text-xs text-slate-500 mt-1">' + reason + '</p>' +
								'<div class="mt-2 flex gap-4 text-xs text-slate-600">' +
									'<span>Hari: <strong class="text-slate-800">' + days + '</strong></span>' +
									'<span>Jam: <strong class="text-slate-800">' + hours + '</strong></span>' +
								'</div>' +
							'</div>' +
						'</div>'
					);
				}).join('');
			timeline.innerHTML = itemsHtml || '<p class="text-sm text-slate-400">Belum ada detail reimburse.</p>';
			modal.classList.remove('hidden');
			modal.classList.add('modal-open');
		}

		function closeDetailModal() {
			const modal = document.getElementById('reimburseDetailModal');
			if (modal) modal.classList.add('hidden');
			if (modal) modal.classList.remove('modal-open');
		}

		function listenToReimburse() {
			const q = query(collection(db, 'reimburse'), orderBy('created_at', 'desc'));
			onSnapshot(q, async snapshot => {
				const rows = [];
				const tasks = [];
				snapshot.forEach(docSnap => {
					const d = docSnap.data() || {};
					const row = {
						id: docSnap.id,
						user_id: d.user_id || '',
						user_name: d.user_name || '',
						user_photo: d.user_photo || d.photo || '',
						start_date: d.start_date || '',
						end_date: d.end_date || d.start_date || '',
						total_days: d.total_days ?? d.days ?? '',
						total_hours: d.total_hours ?? d.hours ?? '',
						status: d.status || 'pending',
						related: d.related || {},
						reason: d.reason || '',
						type: d.type || ''
					};
					rows.push(row);
					if (!row.user_photo && row.user_id) {
						tasks.push((async () => {
							const photo = await resolveUserPhoto(row.user_id);
							row.user_photo = photo || '';
						})());
					}
				});
				if (tasks.length) {
					await Promise.all(tasks);
				}
				allReimburse = rows;
				groupedReimburse = buildGroupedReimburse(rows);
				applyFilters();
			}, err => {
				console.error('Gagal memuat data reimburse', err);
				showToast('Gagal memuat data reimburse.', 'error');
			});
		}

		if (reimburseSearch) {
			reimburseSearch.addEventListener('input', ev => {
				currentSearch = ev.target.value || '';
				applyFilters();
			});
		}
		if (reimburseStatusFilter) {
			reimburseStatusFilter.addEventListener('change', ev => {
				currentStatus = ev.target.value || '';
				applyFilters();
			});
		}

		if (reimburseTableBody) {
			reimburseTableBody.addEventListener('click', ev => {
				const btn = ev.target.closest('[data-action="complete"]');
				if (btn) {
					const key = btn.getAttribute('data-id');
					markCompleted(key);
					return;
				}
				const detailBtn = ev.target.closest('[data-action="detail"]');
				if (!detailBtn) return;
				const key = detailBtn.getAttribute('data-id');
				openDetailModal(key);
			});
		}

		const detailModalClose = document.getElementById('detailModalClose');
		const detailModalOk = document.getElementById('detailModalOk');
		if (detailModalClose) detailModalClose.addEventListener('click', closeDetailModal);
		if (detailModalOk) detailModalOk.addEventListener('click', closeDetailModal);
		const detailModalEl = document.getElementById('reimburseDetailModal');
		if (detailModalEl) detailModalEl.addEventListener('click', ev => { if (ev.target === detailModalEl) closeDetailModal(); });

		onAuthStateChanged(auth, user => {
			if (user) {
				listenToReimburse();
			} else {
				window.location.href = "../index.html";
			}
		});
	</script>
</body>
</html>
